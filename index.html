<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202827" />
    <meta name="description" content="Ketchup — a precise little space for your next big idea. A Rust 3D edge editor for desktop and web." />
    <title>Ketchup — 3D workspace</title>
    <link data-trunk rel="rust" href="crates/ketchup-app/Cargo.toml" data-bin="ketchup-app" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ce563f'/%3E%3Cpath d='M18 16v32m28-32L19 34l27 14' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f1eb; font-family: system-ui, sans-serif; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
      #loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: #33413c; }
      #loading strong { font-size: 32px; letter-spacing: -1.5px; }
      #loading p { font-size: 14px; opacity: .7; max-width: 420px; line-height: 1.6; padding: 0 24px; }
    </style>
  </head>
  <body>
    <canvas id="ketchup-canvas" tabindex="0" aria-label="Ketchup 3D modeling workspace"></canvas>
    <div id="loading"><strong>Ketchup<span style="color:#ce563f">.</span></strong><p>Making room for your next idea…</p></div>
  </body>
</html>
