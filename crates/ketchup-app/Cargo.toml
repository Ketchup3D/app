[package]
name = "ketchup-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ketchup-core = { path = "../ketchup-core" }
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit", "persistence"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgpu", "webgl"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"
png = "0.18"
