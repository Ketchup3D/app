[workspace]
members = ["crates/ketchup-core", "crates/ketchup-app"]
default-members = ["crates/ketchup-app"]
resolver = "2"

[workspace.package]
version = "0.6.5"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glam = { version = "0.32", features = ["serde"] }

# Keep the development UI responsive without disabling debugger symbols,
# debug assertions, or overflow checks. Optimize third-party rendering/UI code
# more heavily than frequently edited application code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ketchup-core]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
