[workspace]
members = ["crates/ketchup-core", "crates/ketchup-app"]
default-members = ["crates/ketchup-app"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.32", features = ["serde"] }

[profile.release]
opt-level = 2
lto = "thin"
